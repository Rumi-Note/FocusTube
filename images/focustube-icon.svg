<!-- BRIEF: FocusTube app icon; no letters; coral-to-crimson focus aperture around a dark video window, white play symbol, transparent 16px safety area; readable at 16px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">FocusTube icon</title>
  <desc id="desc">A focused video window surrounded by four darkening panels.</desc>
  <defs>
    <linearGradient id="background-gradient" x1="26" y1="20" x2="104" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7569"/>
      <stop offset="0.52" stop-color="#f0444c"/>
      <stop offset="1" stop-color="#c91f39"/>
    </linearGradient>
    <linearGradient id="screen-gradient" x1="42" y1="42" x2="88" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#262c3a"/>
      <stop offset="1" stop-color="#11141c"/>
    </linearGradient>
    <filter id="soft-shadow" x="8" y="10" width="112" height="116" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#53101d" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g id="app-tile" filter="url(#soft-shadow)">
    <rect x="16" y="16" width="96" height="96" rx="25" fill="url(#background-gradient)"/>
    <path d="M40 16h48l-9 23H49z" fill="#6f1427" opacity="0.38"/>
    <path d="M16 40v48l24-10V50z" fill="#671427" opacity="0.42"/>
    <path d="M112 40v48L88 78V50z" fill="#671427" opacity="0.42"/>
    <path d="M40 112h48l-9-23H49z" fill="#5e1325" opacity="0.48"/>
    <path d="M30 35c8-11 19-16 34-16 13 0 24 4 32 12" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="3" opacity="0.18"/>
  </g>

  <g id="focused-video">
    <rect x="38" y="39" width="52" height="50" rx="11" fill="url(#screen-gradient)" stroke="#fff" stroke-width="3"/>
    <rect x="43" y="44" width="42" height="40" rx="7" fill="#191e29"/>
    <path d="M58 53.5c0-2 2.2-3.2 3.9-2.1l17.2 10.5c1.6 1 1.6 3.3 0 4.3L61.9 76.7c-1.7 1.1-3.9-.2-3.9-2.1z" fill="#fff"/>
  </g>

  <g id="focus-corners" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="4">
    <path d="M32 49v-8c0-5 4-9 9-9h8"/>
    <path d="M79 32h8c5 0 9 4 9 9v8"/>
    <path d="M96 79v8c0 5-4 9-9 9h-8"/>
    <path d="M49 96h-8c-5 0-9-4-9-9v-8"/>
  </g>
</svg>
